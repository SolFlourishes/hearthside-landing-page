<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Hearthside Works arch -->
  <path 
    d="M 20 80 A 30 30 0 0 1 80 80" 
    stroke="#E28A6D" 
    stroke-width="6" 
    fill="none" 
    stroke-linecap="round"
  />
  
  <!-- Speech bubble -->
